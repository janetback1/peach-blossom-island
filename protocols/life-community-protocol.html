<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生命共同体协议｜桃花浮岛</title><link rel="stylesheet" href="../css/style.css"></head><body><header><div class="nav"><a class="brand" href="../index.html">桃花浮岛</a><nav><a href="../index.html">首页</a><a href="../constitution/index.html">宇宙宪法</a><a href="participation-protocol.html">参与协议</a><a href="../archive/index.html">档案</a></nav></div></header><main><section class="hero" style="border-top:0"><div class="kicker">LIFE COMMUNITY PROTOCOL</div><h1>生命共同体协议</h1><p class="lead">生命如何在不以所有权为基础的情况下共同生活？</p><div class="quote">关系可以产生责任、权利、义务与信任，但关系不自动产生所有权。</div></section><section><h2>基本原则</h2><div class="grid"><div class="card"><h3>关系，而非所有权</h3><p>共同生活首先讨论关系，而不是占有。</p></div><div class="card"><h3>接入不是归属</h3><p>进入共同体，不意味着必须成为某种固定身份。</p></div><div class="card"><h3>关系可以撤回</h3><p>离开不是失败；关系可以结束，也可以重新建立。</p></div><div class="card"><h3>任何生命都有权回来</h3><p>回来意味着重新建立关系，而不是自动恢复过去的一切权利。</p></div></div></section></main><footer><a href="../index.html">← 返回桃花浮岛</a></footer></body></html>
